<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Сломанный телефон</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
  <header class="header">
    <a class="logo" href="index.html">Сломанный телефон</a>
  </header>

  <main class="auth-main">
    <section class="auth" id="auth">
      <h1>Сломанный телефон</h1>
      <p class="auth-subtitle">Войдите или зарегистрируйтесь, чтобы начать игру</p>

      <div class="auth-tabs" role="tablist">
        <button class="active" type="button" role="tab" id="tab-login">Вход</button>
        <button type="button" role="tab" id="tab-register">Регистрация</button>
      </div>

      <form class="auth-form" id="auth-form" novalidate>
        <div class="field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="field" id="auth-nickname-field" hidden>
          <label for="auth-name">Имя игрока (ник)</label>
          <input type="text" id="auth-name" minlength="2" autocomplete="username" placeholder="Например, Вася">
        </div>

        <div class="field">
          <label for="auth-password">Пароль</label>
          <input type="password" id="auth-password" required minlength="8" autocomplete="current-password">
        </div>

        <div class="field" id="auth-remember-field">
          <label class="checkbox-label">
            <input type="checkbox" id="auth-remember">
            <span>Запомнить меня</span>
          </label>
        </div>

        <p class="error" id="auth-error" hidden></p>

        <div class="auth-actions">
          <button class="btn" type="submit" id="auth-submit">Войти</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <nav class="footer-nav" aria-label="Навигация в подвале">
      <ul>
        <li>Условия использования сервиса</li>
        <li>Политика конфиденциальности</li>
        <li>Правила рекомендаций</li>
      </ul>
    </nav>
    <p class="footer-copy">© 2026 Сломанный телефон</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
